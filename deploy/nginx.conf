server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A .wasm served as application/octet-stream is refused by
    # WebAssembly.instantiateStreaming. Modern nginx already maps it in mime.types;
    # default_type covers the image that does not, without replacing the whole map
    # (a bare `types { ... }` block here would silently unset text/css and friends).
    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css text/plain application/xml;
}
