version: 1
frontend:
  phases:
    preBuild:
      commands:
        - curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
        - source "$HOME/.cargo/env"
        - curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
    build:
      commands:
        - source "$HOME/.cargo/env"
        # A URL da branch no Amplify. Com domínio próprio, troque por ele.
        - export DEMO_SITE_URL="https://$AWS_BRANCH.$AWS_APP_ID.amplifyapp.com"
        - ./scripts/build.sh
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - $HOME/.cargo/registry/**/*
      - $HOME/.cargo/git/**/*
      - target/**/*

# Sem isto, o Amplify pode servir o módulo como application/octet-stream.
customHeaders:
  - pattern: '**/*.wasm'
    headers:
      - key: Content-Type
        value: application/wasm
